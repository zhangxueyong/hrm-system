# 应用服务 WEB 访问端口
server.port=8080
server.servlet.context-path=/


spring.web.resources.static-locations=classpath:/templates/,classpath:/static
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
#数据源
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/hrm?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
# THYMELEAF (ThymeleafAutoConfiguration)
# 开启模板缓存（默认值： true ） #cache: 是否缓存，开发模式下设置为false，避免改了模板还要重启服务器，线上设置为true，可以提高性能。
spring.thymeleaf.cache=false
# 检查模板是否存在，然后再呈现
spring.thymeleaf.check-template=true
# 检查模板位置是否正确（默认值 :true ）
spring.thymeleaf.check-template-location=true
#Content-Type 的值（默认值： text/html ）
spring.thymeleaf.content-type=text/html
# 开启 MVC Thymeleaf 视图解析（默认值： true ）
spring.thymeleaf.enabled=true
# 模板编码
spring.thymeleaf.encoding=UTF-8
# 要被排除在解析之外的视图名称列表，⽤逗号分隔
#spring.thymeleaf.excluded-view-names=
# 要运⽤于模板之上的模板模式。另⻅ StandardTemplate-ModeHandlers( 默认值： HTML5)
spring.thymeleaf.mode=HTML5
# 在构建 URL 时添加到视图名称前的前缀（默认值： classpath:/templates/ ）
#spring.thymeleaf.prefix=classpath:/templates/,classpath:/static
# 在构建 URL 时添加到视图名称后的后缀（默认值： .html ）
#spring.thymeleaf.suffix=.html

#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
# 当mapper接口和mapper接口对应的配置文件在
#命名上相同
#所在的路径相同
#则mapper-locations可以不用配置，配置也不会生效
mybatis.mapper-locations=classpath:mapper/*.xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=com.zxy.hrm.*.dao
#开启驼峰命名
mybatis.configuration.map-underscore-to-camel-case=true






#热部署
spring.devtools.restart.enabled=true

#分页插件
pagehelper.helperDialect=mysql
pagehelper.params=count=countSql
pagehelper.supportMethodsArguments=true
pagehelper.reasonable=true
pagehelper.autoRuntimeDialect=true
#日志

#mybatis日志级别
logging.level.com.zxy.hrm.checking.dao=debug




